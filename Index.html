<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SteamTools Plugin | Glitchsize</title>
    <style>
        :root {
            --steam-dark: #171a21;
            --steam-blue: #1b2838;
            --steam-accent: #66c0f4;
            --steam-gradient: linear-gradient(90deg, #06bfff 0%, #2d73ff 100%);
            --text-main: #ffffff;
            --text-muted: #8f98a0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--steam-dark);
            background-image: radial-gradient(circle at center, #1b2838 0%, #171a21 100%);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            max-width: 600px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(102, 192, 244, 0.1);
        }

        /* --- Header avec le vrai logo Steam --- */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 2rem;
        }

        .steam-logo {
            width: 50px;
            height: 50px;
            /* Filtre pour ajouter une légère lueur bleue autour du logo */
            filter: drop-shadow(0 0 5px var(--steam-accent));
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .download-box {
            background: linear-gradient(180deg, rgba(42, 71, 94, 0.6) 0%, rgba(23, 26, 33, 0.8) 100%);
            padding: 2rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            border: 1px solid rgba(102, 192, 244, 0.2);
        }

        .btn-download {
            display: inline-block;
            background: var(--steam-gradient);
            color: white;
            padding: 15px 35px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            text-transform: uppercase;
        }

        .btn-download:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(6, 191, 255, 0.5);
            filter: brightness(1.1);
        }

        .links-grid {
            text-align: left;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 1.5rem;
        }

        .link-card {
            margin-bottom: 1.2rem;
        }

        .link-card a {
            color: var(--steam-accent);
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .link-card a:hover { text-decoration: underline; }

        .desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .video-wrapper {
            margin-top: 1.5rem;
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <header class="header">
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/83/Steam_icon_logo.svg" alt="Steam Logo" class="steam-logo">
        <h1>SteamTools Plugin</h1>
    </header>

    <div class="download-box">
        <p style="margin-top: 0; color: var(--steam-accent);">Version 1.0.1 par <strong>Glitchsize</strong></p>
        <a href="https://cdn.discordapp.com/attachments/1469113489753641244/1469113565364355163/steamtools_plugin_By_Glitchsize_V_1.0.1.zip?ex=698722e0&is=6985d160&hm=0da324492ed7e27f28d010e8a1aac16f95ebf626221b0ccf6840f8cc88664041&" class="btn-download">
            TÉLÉCHARGER LE PLUGIN
        </a>
    </div>

    <div class="links-grid">
        <div class="link-card">
            <a href="https://steambrew.app/" target="_blank">Millennium (SteamBrew)</a>
            <div class="desc">Le logiciel nécessaire pour charger le plugin.</div>
        </div>

        <div class="link-card">
            <a href="https://www.steamtools.net/" target="_blank">Steam Tools</a>
            <div class="desc">Dépendance essentielle pour le fonctionnement.</div>
        </div>

        <div class="link-card">
            <strong style="display: block; margin-bottom: 10px;">Tutoriel Vidéo :</strong>
            <div class="video-wrapper">
                <iframe src="https://www.youtube.com/embed/EA2WoyP7_fo" allowfullscreen></iframe>
            </div>
        </div>
    </div>
</div>

</body>
</html>
