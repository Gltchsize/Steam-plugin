<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SteamTools Plugin | Glitchsize</title>
    <style>
        :root {
            --steam-dark: #0b1014;
            --steam-card: rgba(27, 40, 56, 0.8);
            --steam-accent: #1a9fff;
            --steam-gradient: linear-gradient(90deg, #00ccff 0%, #3366ff 100%);
            --text-main: #e9eaec;
            --text-muted: #8f98a0;
        }

        body {
            font-family: 'Motiva Sans', Sans-Serif, Arial;
            background: radial-gradient(circle at top right, #1b2838, #0b1014);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Effet de fond moderne */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('https://community.cloudflare.steamstatic.com/public/images/profile/effects/0/bg_black.jpg');
            opacity: 0.3;
            z-index: -1;
        }

        .container {
            background: var(--steam-card);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            max-width: 650px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header avec Logo Steam */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 2.5rem;
        }

        .steam-logo {
            width: 45px;
            height: 45px;
            filter: drop-shadow(0 0 10px var(--steam-accent));
        }

        h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(to bottom, #ffffff, #a5a5a5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Box de téléchargement */
        .download-card {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2.5rem;
            border-bottom: 2px solid var(--steam-accent);
        }

        .download-card p {
            margin-top: 0;
            font-size: 1.1rem;
            color: var(--text-muted);
        }

        .btn-main {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--steam-gradient);
            color: white;
            padding: 16px 40px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(0, 204, 255, 0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-main:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(0, 204, 255, 0.4);
        }

        /* Section Liens */
        .info-grid {
            display: grid;
            gap: 1.5rem;
            text-align: left;
        }

        .info-item {
            padding: 12px;
            border-left: 3px solid transparent;
            transition: 0.3s;
        }

        .info-item:hover {
            background: rgba(255, 255, 255, 0.03);
            border-left-color: var(--steam-accent);
        }

        .info-item a {
            color: var(--steam-accent);
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .description {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        /* Vidéo stylisée */
        .video-box {
            margin-top: 2rem;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }

        .video-box iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }

        footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            opacity: 0.6;
        }
    </style>
</head>
<body>

<div class="container">
    <header class="header">
        <svg class="steam-logo" viewBox="0 0 24 24" fill="white">
            <path d="M12 0C5.373 0 0 5.373 0 12c0 1.24.189 2.434.54 3.558l5.584 2.292c.31-.157.653-.25 1.018-.25.176 0 .344.024.506.064l2.67-3.868A2.99 2.99 0 0110 11.5c0-1.657 1.343-3 3-3s3 1.343 3 3-1.343 3-3 3c-.09 0-.178-.008-.264-.02l-3.87 2.668c.038.16.06.326.06.496a3 3 0 11-3-3c.17 0 .333.02.492.058l2.29-5.58A11.956 11.956 0 0012 0zm0 2c5.523 0 10 4.477 10 10s-4.477 10-10 10c-1.49 0-2.895-.326-4.156-.913l5.06-2.074c.03.012.064.017.096.017a1 1 0 10-1-1c0 .034.006.066.018.097l-2.075 5.06A7.994 7.994 0 014 12c0-4.418 3.582-8 8-8z"/>
        </svg>
        <h1>SteamTools v1.0.1</h1>
    </header>

    <div class="download-card">
        <p>Propulsé par <strong>Glitchsize</strong></p>
        <a href="https://cdn.discordapp.com/attachments/1469113489753641244/1469113565364355163/steamtools_plugin_By_Glitchsize_V_1.0.1.zip?ex=698722e0&is=6985d160&hm=0da324492ed7e27f28d010e8a1aac16f95ebf626221b0ccf6840f8cc88664041&" class="btn-main">
            Installer le Plugin
        </a>
    </div>

    <div class="info-grid">
        <div class="info-item">
            <a href="https://steambrew.app/" target="_blank">Millennium Framework</a>
            <div class="description">Le moteur indispensable pour injecter vos plugins Steam.</div>
        </div>

        <div class="info-item">
            <a href="https://www.steamtools.net/" target="_blank">Steam Tools Library</a>
            <div class="description">Base de données nécessaire pour l'activation des jeux.</div>
        </div>

        <div class="info-item">
            <span style="font-weight: bold; color: white;">Guide d'installation</span>
            <div class="video-box">
                <iframe src="https://www.youtube.com/embed/EA2WoyP7_fo" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <footer>
        SteamTools Plugin &copy; 2024-2026 | Non affilié à Valve Corp.
    </footer>
</div>

</body>
</html>
